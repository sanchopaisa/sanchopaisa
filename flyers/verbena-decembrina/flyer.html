<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Verbena Decembrina</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Archivo:wght@500;700;900&family=Archivo+Narrow:wght@600;700&display=block" rel="stylesheet">
<style>
:root{--ink:#0c0a08;--cream:#fff3dc;--red:#ff2d2d;--green:#17c46b;--gold:#ffc83d;}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden}
.f{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Archivo,sans-serif;color:var(--cream)}
.hero{position:absolute;inset:0 0 auto 0;height:1080px;background:url(p30505255.jpg) center 35%/cover;filter:saturate(1.15) contrast(1.08)}
.hero::after{content:"";position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(12,10,8,.55) 0%,rgba(12,10,8,.05) 22%,rgba(12,10,8,.25) 50%,rgba(12,10,8,.85) 78%,var(--ink) 100%),
 radial-gradient(ellipse at 50% 30%,rgba(255,120,40,.18),transparent 60%)}
.lights{position:absolute;left:0;right:0;bottom:0;height:560px;background:url(p10545628.jpg) center/cover;opacity:.2;mix-blend-mode:screen;
 -webkit-mask:linear-gradient(180deg,transparent,#000 70%,#000)}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.22;mix-blend-mode:overlay}

/* top */
.top{position:absolute;top:44px;left:56px;right:56px;display:flex;justify-content:space-between;align-items:flex-start}
.invita{font-family:'Archivo Narrow';font-weight:700;letter-spacing:.22em;font-size:22px;line-height:1.35;text-transform:uppercase}
.invita b{display:block;font-family:Archivo;font-weight:900;font-size:34px;letter-spacing:.02em}
.invita small{color:var(--gold);font-size:18px}
.badge{width:170px;height:170px;border-radius:50%;background:var(--red);display:grid;place-items:center;text-align:center;transform:rotate(10deg);
 box-shadow:0 0 0 6px var(--ink),0 0 0 9px var(--red),0 18px 40px rgba(0,0,0,.5)}
.badge span{display:block;font-family:'Archivo Narrow';font-weight:700;font-size:22px;letter-spacing:.15em}
.badge strong{display:block;font-family:Anton;font-size:84px;line-height:.9}

/* title */
.title{position:absolute;top:505px;left:0;right:0;text-align:center}
.verbena{font-family:Anton;font-size:268px;line-height:.82;letter-spacing:-.01em;color:var(--cream);text-transform:uppercase;
 text-shadow:0 10px 0 var(--red),0 20px 60px rgba(0,0,0,.6)}
.deci{font-family:Yellowtail;font-size:150px;color:var(--gold);transform:rotate(-7deg);margin-top:-70px;margin-left:120px;
 text-shadow:0 4px 0 #8a1010,0 0 40px rgba(255,200,61,.45)}

/* polaroid */
.pola{position:absolute;top:215px;left:52px;width:224px;background:#f6efe2;padding:12px 12px 46px;transform:rotate(-8deg);box-shadow:0 20px 40px rgba(0,0,0,.55)}
.pola img{width:100%;height:205px;object-fit:cover;object-position:60% 35%;display:block;filter:contrast(1.05) saturate(1.1)}
.pola p{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:Yellowtail;color:#1a1a1a;font-size:29px}
.tape{position:absolute;width:110px;height:34px;background:rgba(255,200,61,.75);top:-16px;left:70px;transform:rotate(4deg)}

/* starburst */
.burst{position:absolute;top:262px;right:62px;width:236px;height:236px;transform:rotate(-12deg)}
.burst svg{position:absolute;inset:0}
.burst div{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink);font-family:Anton;font-size:36px;line-height:.95;text-transform:uppercase}
.burst div em{font-style:normal;display:block;font-size:44px}

/* genres */
.genres{position:absolute;top:960px;left:56px;right:56px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;flex-wrap:nowrap}
.genres span{font-family:'Archivo Narrow';font-weight:700;font-size:24px;letter-spacing:.06em;text-transform:uppercase;padding:9px 17px;white-space:nowrap;border:2.5px solid var(--cream);border-radius:999px}
.genres .on{background:var(--green);border-color:var(--green);color:var(--ink)}
.genres .r{background:var(--red);border-color:var(--red)}

/* info ticket */
.ticket{position:absolute;left:56px;right:56px;top:1070px;height:150px;background:var(--cream);color:var(--ink);border-radius:18px;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
.ticket .d{background:var(--gold);display:flex;flex-direction:column;justify-content:center;padding-left:30px;border-right:4px dashed var(--ink);position:relative}
.ticket .d small{font-family:'Archivo Narrow';font-weight:700;font-size:22px;letter-spacing:.18em}
.ticket .d b{font-family:Anton;font-size:60px;line-height:1}
.ticket .d i{font-style:normal;font-family:Archivo;font-weight:900;font-size:24px}
.ticket .l{display:flex;flex-direction:column;justify-content:center;padding:0 30px}
.ticket .l b{font-family:Anton;font-size:50px;line-height:1;text-transform:uppercase}
.ticket .l span{font-weight:700;font-size:24px;margin-top:6px}
.ticket .l span u{text-decoration:none;color:var(--red)}

/* reservas */
.res{position:absolute;left:56px;right:56px;bottom:40px;display:flex;align-items:center;justify-content:center;gap:22px}
.res p{font-family:'Archivo Narrow';font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);line-height:1.2;text-align:right}
.res .n{font-family:Archivo;font-weight:900;font-size:40px;letter-spacing:.01em;display:flex;gap:20px;align-items:center}
.res .n svg{width:34px;height:34px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
.spark{position:absolute;color:var(--gold)}
</style></head><body>
<div class="f">
  <div class="hero"></div>
  <div class="lights"></div>

  <div class="top">
    <div class="invita"><small>Invitan</small><b>Samuel Ríos</b><b>&amp; Santiago Tobón</b></div>
    <div class="badge"><div><span>SÁBADO</span><strong>5</strong><span>DIC</span></div></div>
  </div>

  <div class="pola"><div class="tape"></div><img src="p5104135.jpg" alt=""><p>¡vallenato en vivo!</p></div>

  <div class="burst">
    <svg viewBox="0 0 100 100"><polygon fill="#ffc83d" points="50,0 57,18 75,6 72,27 94,25 82,42 100,50 82,58 94,75 72,73 75,94 57,82 50,100 43,82 25,94 28,73 6,75 18,58 0,50 18,42 6,25 28,27 25,6 43,18"/></svg>
    <div><span>Licor<em>incluido</em></span></div>
  </div>

  <div class="title">
    <div class="verbena">Verbena</div>
    <div class="deci">Decembrina</div>
  </div>

  <svg class="spark" style="top:600px;left:70px;width:46px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
  <svg class="spark" style="top:560px;right:90px;width:30px;color:#fff3dc" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>
  <svg class="spark" style="top:880px;right:150px;width:38px" viewBox="0 0 24 24"><path fill="currentColor" d="M12 0c1 7 5 11 12 12-7 1-11 5-12 12-1-7-5-11-12-12 7-1 11-5 12-12z"/></svg>

  <div class="genres">
    <span class="r">Música en vivo</span><span class="on">Decembrina</span><span>Popular</span><span class="on">Vallenato</span><span>&amp; más</span>
  </div>

  <div class="ticket">
    <div class="d"><small>INGRESO</small><b>9:30 PM</b><i>Sábado 5 de dic.</i></div>
    <div class="l"><b>Hotel Villa Juana</b><span>Entrada 7 · Vía <u>Pereira – Cerritos</u></span></div>
  </div>

  <div class="res">
    <p>Información<br>y reservas</p>
    <div class="n">
      <svg viewBox="0 0 24 24"><path fill="#17c46b" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.6-.1 1.2z"/></svg>
      <span>315 579 6795</span><i class="dot"></i><span>321 505 9041</span>
    </div>
  </div>

  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body></html>
