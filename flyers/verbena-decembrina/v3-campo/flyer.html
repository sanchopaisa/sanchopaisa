<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<title>Verbena Decembrina</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
:root{--c:#fff6ea;--acc:#ff4d1a;--ink:#140c07}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden}
.f{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'Inter Tight',sans-serif;color:var(--c)}
.ph{position:absolute;inset:0;background:url(p20197333.jpg) 50% 0%/cover;filter:contrast(1.05) saturate(1.1)}
.ph::after{content:"";position:absolute;inset:0;background:
 linear-gradient(180deg,rgba(20,12,7,.45) 0%,rgba(20,12,7,0) 30%,rgba(20,12,7,0) 70%,rgba(20,12,7,.8) 87%,rgba(20,12,7,.95) 100%)}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none}
.pad{position:absolute;inset:56px 60px 50px}

.top{display:flex;justify-content:space-between;align-items:flex-start;font-size:22px;font-weight:500;line-height:1.3}
.top .r{text-align:right}
.top b{font-weight:800}
.date{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:.9}
.date span{color:var(--acc)}

h1{margin-top:40px;font-weight:800;font-size:184px;line-height:.82;letter-spacing:-.065em;margin-left:-6px}
h1 em{display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.025em;font-size:192px;line-height:.86;margin-left:4px}
h1 sup{font-family:'Inter Tight';font-style:normal;font-weight:600;font-size:40px;color:var(--acc);vertical-align:top;position:relative;top:22px;margin-left:6px;letter-spacing:0}

.side{position:absolute;right:0;top:640px;text-align:right}
.tag{display:inline-flex;align-items:center;gap:10px;background:var(--acc);color:#fff;font-weight:600;font-size:22px;padding:9px 18px;border-radius:999px;margin-bottom:22px}
.tag i{width:8px;height:8px;border-radius:50%;background:#fff}
.side h3,.grid h3{font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,246,234,.7);margin-bottom:8px}
.side p{font-size:30px;font-weight:600;line-height:1.18;letter-spacing:-.01em}
.side p span{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:34px}

.bot{position:absolute;left:0;right:0;bottom:0}
.rule{height:1.5px;background:rgba(255,246,234,.5);margin-bottom:22px}
.grid{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;font-size:22px;line-height:1.35}
.grid b{font-weight:600}
.grid .ph2{text-align:right}
</style></head><body>
<div class="f">
  <div class="ph"></div>
  <div class="pad">
    <div class="top">
      <div>Samuel Ríos &amp; Santiago Tobón<br><b>invitan</b></div>
      <div class="r"><div class="date">05<span>.</span>12</div>sábado · 9:30 pm</div>
    </div>

    <h1>verbena<em>decembrina<sup>✱</sup></em></h1>

    <div class="side">
      <div class="tag"><i></i>Licor incluido</div>
      <h3>Música en vivo</h3>
      <p>Decembrina<br>Popular<br>Vallenato <span>y más</span></p>
    </div>

    <div class="bot">
      <div class="rule"></div>
      <div class="grid">
        <div><h3>Lugar</h3><b>Hotel Villa Juana</b><br>Entrada 7, vía Pereira–Cerritos</div>
        <div class="ph2"><h3>Info y reservas</h3><b>315 579 6795</b><br><b>321 505 9041</b></div>
      </div>
    </div>
  </div>
  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body></html>
